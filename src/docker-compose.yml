services:
  catalogdb:
    image: postgres:16
  
  basketdb:
    image: postgres:16

  distributedcache: 
    image: redis

  catalogapi:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Services/Catalog/Catalog API/Dockerfile

  basketapi:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: Services/Basket/Basket API/Dockerfile

volumes:
  postgres_catalog:
  postgres_basket:


